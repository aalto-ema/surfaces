name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'packaging/windows/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'packaging/windows/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and packaging tooling
        run: python -m pip install . "PyInstaller==6.22.3"
      - name: Freeze Surfaces and compile the installer
        run: ./packaging/windows/build.ps1
      - name: Verify install, launch, export, and uninstall
        run: ./packaging/windows/test-install.ps1
      - name: Upload installer and SHA-256 checksum
        uses: actions/upload-artifact@v7
        with:
          name: Surfaces-Windows-x64
          path: dist/installer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload install diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-diagnostics
          path: |
            ${{ runner.temp }}/Surfaces installer smoke test/*.log
            ${{ runner.temp }}/Surfaces installer smoke test/smoke.txt
          if-no-files-found: ignore
          retention-days: 7
